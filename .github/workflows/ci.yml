name: CI

on:
  push:
    branches: [main, release]  # pushing to `release` publishes v<VERSION from app/desktop.py>
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # needed to attach the AppImage to a release

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Build content (KANJIDIC2, JMdict, Tatoeba)
        run: |
          ./scripts/fetch_sources.sh
          python -m scripts.build_content
      - name: Tests
        run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: content-db
          path: data/content.db
          retention-days: 7

  appimage:
    needs: test
    runs-on: ubuntu-22.04  # older base = works on more distributions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: content-db
          path: data
      - name: Build AppImage
        run: ./scripts/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Shuinkan-AppImage
          path: dist/Shuinkan-*-x86_64.AppImage
      - name: Attach to release (tags and the release branch)
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"; [ "$GITHUB_REF_TYPE" = tag ] || TAG="v$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app/desktop.py)"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Shuinkan $TAG" --generate-notes || true
          gh release upload "$TAG" dist/Shuinkan-*-x86_64.AppImage data/content.db --clobber

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: content-db
          path: data
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller pillow
      - name: Tests (on Windows)
        run: python -m pytest -q
      - name: Build Shuinkan.exe
        run: pyinstaller packaging/windows/shuinkan.spec --noconfirm
      - name: Smoke test (start, load a page, stop)
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\appdata"
          Start-Process -FilePath dist\Shuinkan\Shuinkan.exe -ArgumentList "--browser"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/login; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 2
          }
          Get-Content "$env:LOCALAPPDATA\Shuinkan\shuinkan.log" -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Shuinkan.exe did not start" }
          & dist\Shuinkan\Shuinkan.exe --stop
          Start-Sleep -Seconds 4
      - name: Portable zip + installer
        run: |
          $v = (Select-String -Path app\desktop.py -Pattern '^VERSION = "(.*)"').Matches[0].Groups[1].Value
          Compress-Archive -Path dist\Shuinkan -DestinationPath "dist\Shuinkan-$v-windows-portable.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DVersion=$v" packaging\windows\shuinkan.iss
          Get-ChildItem dist\*.exe, dist\*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Shuinkan-Windows
          path: |
            dist/Shuinkan-Setup-*.exe
            dist/Shuinkan-*-windows-portable.zip
      - name: Attach to release (tags and the release branch)
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF_TYPE -ne "tag") { $tag = "v" + ((Select-String -Path app\desktop.py -Pattern '^VERSION = "(.*)"').Matches[0].Groups[1].Value) }
          gh release create $tag --target $env:GITHUB_SHA --title "Shuinkan $tag" --generate-notes 2>$null
          gh release upload $tag (Get-ChildItem dist\Shuinkan-Setup-*.exe).FullName (Get-ChildItem dist\Shuinkan-*-windows-portable.zip).FullName --clobber

  android:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: content-db
          path: data
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Stage Shuinkan into the Android project
        run: ./scripts/stage_android.sh
      - name: Build APK
        env:
          CHAQUOPY_BUILD_PYTHON: python3
        run: gradle -p android assembleRelease --stacktrace --no-daemon
      - name: Name the APK
        run: |
          V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app/desktop.py)
          mkdir -p dist && cp android/app/build/outputs/apk/release/*.apk "dist/Shuinkan-$V-android.apk"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Shuinkan-Android
          path: dist/Shuinkan-*-android.apk
      - name: Enable KVM (for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run it in an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./scripts/android_smoke_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: android-smoke/
      - name: Attach to release (tags and the release branch)
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"; [ "$GITHUB_REF_TYPE" = tag ] || TAG="v$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app/desktop.py)"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Shuinkan $TAG" --generate-notes || true
          gh release upload "$TAG" dist/Shuinkan-*-android.apk --clobber
